<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACBV Flix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0f;--panel:#16161d;--ink:#f4f4f6;--mute:#a3a3b0;--red:#e5262b;--yellow:#f6c915;--blue:#1e5fb5;--green:#1f9d55}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 4vw;background:#000}
header img{height:38px;display:block}
.brand{font:34px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.04em;color:var(--red)}
[hidden]{display:none!important}
.acbv{color:#fff}
.brandlink{display:flex;align-items:center;gap:20px;background:none;padding:0}
nav{display:flex;gap:6px;margin-left:auto;align-items:center}
nav>button,.dd>button{background:none;padding:8px 14px;border-radius:4px;color:var(--mute)}
nav>button:hover,nav>button.on,.dd>button:hover,.dd>button[aria-expanded=true]{color:var(--ink);background:#ffffff1a}
.dd{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:150px;background:var(--panel);border:1px solid #ffffff1f;border-radius:8px;padding:6px;display:none;box-shadow:0 12px 30px #000a}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:none;padding:9px 12px;border-radius:5px;color:var(--ink)}
.menu button:hover,.menu button:focus-visible{background:#ffffff1a}
.wrap{position:relative}
.arrow{position:absolute;top:6px;bottom:14px;width:46px;z-index:4;background:#000b;font-size:26px;opacity:0;transition:opacity .2s;display:grid;place-items:center}
.wrap:hover .arrow,.arrow:focus-visible{opacity:1}
.arrow.l{left:0;border-radius:0 6px 6px 0}.arrow.r{right:0;border-radius:6px 0 0 6px}
@media(hover:none){.arrow{opacity:1}}
#sobre{padding:130px 4vw 90px;max-width:900px;margin:0 auto;min-height:80vh}
#sobre h1{font:clamp(48px,8vw,90px)/.95 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
#sobre p{margin-top:18px;line-height:1.7;color:#d6d6de;font-size:18px}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;padding:0 4vw 9vh;background:#000 center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0fee 15%,#0b0b0f33 70%),linear-gradient(#0000 55%,var(--bg))}
.hero>div{position:relative;z-index:1;max-width:560px}
.hero>.hbgs{position:absolute;inset:0;max-width:none;z-index:0}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s}
.hbg.on{opacity:1}
.tag{position:absolute;z-index:2;top:84px;right:4vw;font:30px/1 "Bebas Neue",Impact,sans-serif;letter-spacing:.08em;color:#fff;background:var(--red);padding:4px 14px;border-radius:4px}
.hero>.dots{position:absolute;z-index:2;right:4vw;bottom:4vh;max-width:none;display:flex;gap:8px}
.dot{width:34px;height:6px;border-radius:3px;background:#ffffff55;padding:0}
.dot.on{background:#fff}
.hero h1{font:clamp(54px,9vw,110px)/.9 "Bebas Neue",Impact,sans-serif;letter-spacing:.02em}
.hero p{margin:14px 0 22px;color:#d6d6de;line-height:1.5}
.btn{padding:11px 26px;border-radius:5px;font-weight:600;margin-right:10px}
.btn.p{background:var(--ink);color:#000}.btn.s{background:#6d6d7766}
.btn:hover{opacity:.85}
main{margin-top:-6vh;position:relative;z-index:2;padding-bottom:60px}
.row{padding:14px 0 10px 4vw}
.row h2{font:30px "Bebas Neue",Impact,sans-serif;letter-spacing:.05em;margin-bottom:8px}
.rail{display:flex;gap:10px;overflow-x:auto;padding:6px 4vw 14px 0;scroll-snap-type:x proximity;scrollbar-width:thin}
.card{flex:0 0 auto;width:clamp(200px,22vw,300px);aspect-ratio:16/9;position:relative;border-radius:6px;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--red) 60%,var(--yellow));scroll-snap-align:start;transition:transform .2s}
.card:hover,.card:focus-visible{transform:scale(1.07);z-index:3}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card span{position:absolute;inset:auto 0 0;padding:26px 10px 8px;text-align:left;font-weight:600;font-size:14px;background:linear-gradient(#0000,#000d)}
.card.empty::before{content:"\25B6";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.5}
#modal{position:fixed;inset:0;z-index:50;background:#000c;display:none;place-items:center;padding:4vw}
#modal.open{display:grid}
.box{width:min(960px,100%);background:var(--panel);border-radius:10px;overflow:hidden}
.video{aspect-ratio:16/9;background:#000;display:grid;place-items:center;color:var(--mute);text-align:center;padding:20px}
.video iframe{width:100%;height:100%;border:0}
.info{padding:18px 22px 22px;position:relative}
.info h3{font:34px "Bebas Neue",Impact,sans-serif;letter-spacing:.04em}
.info p{color:var(--mute);margin-top:6px;line-height:1.5}
.x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;background:#ffffff1f;font-size:20px}
footer{padding:30px 4vw;color:var(--mute);font-size:13px;border-top:1px solid #ffffff14}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>

<script>
/* ========= EDITE AQUI =========
   Para cada ano, liste os curtas. "id" é o código do vídeo no YouTube
   (o que vem depois de watch?v= ). Se deixar vazio, o card aparece sem vídeo. */
const FILMES = {
  2026: [
    { titulo: "A Ultima Chance", id: "vw1hhZUjIoc", sinopse: "O filme mostra a historia" },
    { titulo: "Cartas do Juízo", id: "MeGTV7pp8qk", sinopse: "testando sinopse do filme" },
    { titulo: "Revestindo-se da nova personalidade", id: "Jx0I00s0AGw", sinopse: "Sinopse do curta." },
    { titulo: "EUDOPSE", id: "_0afWVPbcY8", sinopse: "Sinopse do curta." }
  ],
  2025: [
    { titulo: "O som do Silêncio", id: "-9vFqsTeBgg", sinopse: "Sinopse do curta." },
    { titulo: "Sedento por tua presença", id: "P6v4gsaCYYE", sinopse: "Sinopse do curta." },
    { titulo: "Entre dois nomes", id: "xEjogI0Z1qA", sinopse: "Sinopse do curta." },
    { titulo: "Assinado, Fabrício ", id: "sYe2H4UfRLA", sinopse: "Sinopse do curta." },
    { titulo: "Um ato de coragem ", id: "Py5mXFIPPf4", sinopse: "Sinopse do curta." }
  ],
  2024: [
    { titulo: "Broken", id: "ABbO6x0IAYU", sinopse: "Sinopse do curta." },
    { titulo: "Redenção", id: "d2A_DJ1wdzY", sinopse: "Sinopse do curta." },
    { titulo: "The Other Side", id: "AEu89Tdn3jw", sinopse: "Sinopse do curta." },
    { titulo: "Destinos Cruzados", id: "afK3U9L4FFw", sinopse: "Sinopse do curta." }
  ],
  2023: [
    { titulo: "IDE", id: "9C9kElWpDUA", sinopse: "Sinopse do curta." },
    { titulo: "Amparado pelo Amor", id: "Qqf0fUX2Ktk", sinopse: "Sinopse do curta." },
    { titulo: "Além da Luta", id: "_Qw8h12s4Co", sinopse: "Sinopse do curta." },
    { titulo: "Extraordinário", id: "tvQb61arYOQ", sinopse: "Sinopse do curta." }
  ],
  2019: [
    { titulo: "Diário de Classe", id: "PrFlnlpkps0", sinopse: "Sinopse do curta." },
    { titulo: "Zerbini: O bom doutor ", id: "PWom1bnwZtU", sinopse: "Sinopse do curta." },
    { titulo: "Atados", id: "_d0qmjIjfms", sinopse: "Sinopse do curta." },
    { titulo: "Epidemia", id: "TkM2o_NiQOU", sinopse: "Sinopse do curta." }
  ],
  2017: [
    { titulo: "Lutero", id: "OsFcVZFQbW0", sinopse: "Sinopse do curta." },
    { titulo: "Henrique VIII", id: "WFxaZar6lM8", sinopse: "Sinopse do curta." },
    { titulo: "John Wycliffe", id: "uVyBmHc4i44", sinopse: "Sinopse do curta." },
    { titulo: "John Knox ", id: "9x-Ow0aNeBA", sinopse: "Sinopse do curta." },
    { titulo: "Título do curta 2", id: "9rMNaFPeCZU", sinopse: "Sinopse do curta." }
  ],
  2016: [
    { titulo: "A Moreninha", id: "eRjhWn-vlzQ", sinopse: "Sinopse do curta." },
    { titulo: "Romeu e Julieta", id: "vebBKqwV5ts", sinopse: "Sinopse do curta." },
    { titulo: "Senhora", id: "8OHBhCRCsvY", sinopse: "Sinopse do curta." },
    { titulo: "Dom Casmurro", id: "-ILldzcsts0", sinopse: "Sinopse do curta." },
    { titulo: "Iracema", id: "a7LJc-PwwJM", sinopse: "Sinopse do curta." }
  ]
};
/* =============================== */

const $ = s => document.querySelector(s);
const anos = Object.keys(FILMES).sort((a, b) => b - a);
const thumb = f => `https://img.youtube.com/vi/${f.id}/hqdefault.jpg`;

function card(f, ano) {
  const b = document.createElement("button");
  b.className = "card" + (f.id ? "" : " empty");
  if (f.id) {
    const i = new Image(); i.src = thumb(f); i.alt = ""; i.loading = "lazy";
    i.onerror = () => { i.remove(); b.classList.add("empty"); };
    b.append(i);
  }
  const s = document.createElement("span"); s.textContent = f.titulo; b.append(s);
  b.onclick = () => abrir(f, ano);
  return b;
}

const atualizadores = [];
anos.forEach(ano => {
  const r = document.createElement("section");
  r.className = "row"; r.id = "ano" + ano;
  r.innerHTML = `<h2>Filmes de ${ano}</h2><div class="wrap"><button class="arrow l" aria-label="Voltar" hidden>&#10094;</button><div class="rail"></div><button class="arrow r" aria-label="Avançar" hidden>&#10095;</button></div>`;
  const rail = r.querySelector(".rail");
  FILMES[ano].forEach(f => rail.append(card(f, ano)));
  $("#rows").append(r);

  /* Setas: só aparecem quando há mais filmes do que cabem na tela */
  const L = r.querySelector(".l"), R = r.querySelector(".r");
  const atualizar = () => {
    L.hidden = rail.scrollLeft < 5;
    R.hidden = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 5;
  };
  rail.addEventListener("scroll", atualizar, { passive: true });
  L.onclick = () => rail.scrollBy({ left: -rail.clientWidth * 0.8, behavior: "smooth" });
  R.onclick = () => rail.scrollBy({ left: rail.clientWidth * 0.8, behavior: "smooth" });
  atualizadores.push(atualizar); atualizar();

  /* Item do menu "Anos" */
  const n = document.createElement("button");
  n.textContent = ano;
  n.onclick = () => { mostrar("inicio"); fecharMenu(); r.scrollIntoView({ behavior: "smooth", block: "center" }); };
  $("#menuAnos").append(n);
});
addEventListener("resize", () => atualizadores.forEach(f => f()));

/* Menu suspenso "Anos" */
const btnAnos = $("#btnAnos"), menuAnos = $("#menuAnos");
function fecharMenu() { menuAnos.classList.remove("open"); btnAnos.setAttribute("aria-expanded", "false"); }
btnAnos.onclick = e => { e.stopPropagation(); const o = menuAnos.classList.toggle("open"); btnAnos.setAttribute("aria-expanded", o); };
document.addEventListener("click", e => { if (!menuAnos.contains(e.target)) fecharMenu(); });
addEventListener("keydown", e => { if (e.key === "Escape") fecharMenu(); });

/* Troca entre as telas "Início" e "Sobre" */
function mostrar(tela) {
  const inicio = tela === "inicio";
  $("#hero").hidden = $("#rows").hidden = !inicio;
  $("#sobre").hidden = inicio;
  $("#btnInicio").classList.toggle("on", inicio);
  $("#btnSobre").classList.toggle("on", !inicio);
  if (inicio) atualizadores.forEach(f => f());
}
$("#btnInicio").onclick = $("#home").onclick = () => { mostrar("inicio"); fecharMenu(); scrollTo({ top: 0 }); };
$("#btnSobre").onclick = () => { mostrar("sobre"); fecharMenu(); scrollTo({ top: 0 }); };

/* ===== Destaque: carrossel de lançamentos =====
   Mude ANO_DESTAQUE para trocar o ano exibido. TEMPO_TROCA é em milissegundos (5000 = 5 s). */
const ANO_DESTAQUE = 2026;
const TEMPO_TROCA = 5000;
const anoLista = FILMES[ANO_DESTAQUE] ? ANO_DESTAQUE : anos[0];
const lista = FILMES[anoLista];
let atual = 0, timer;
const fundos = lista.map(f => {
  const d = document.createElement("div"); d.className = "hbg";
  d.style.backgroundImage = f.id ? `url(${thumb(f)})` : "radial-gradient(circle at 75% 30%,#1e5fb5aa,#e5262b66 45%,#000 75%)";
  $("#hBg").append(d); return d;
});
const pontos = lista.length > 1 ? lista.map((f, i) => {
  const p = document.createElement("button"); p.className = "dot"; p.setAttribute("aria-label", "Ver " + f.titulo);
  p.onclick = () => { ir(i); iniciar(); };
  $("#dots").append(p); return p;
}) : [];
function ir(i) {
  atual = (i + lista.length) % lista.length;
  fundos.forEach((d, k) => d.classList.toggle("on", k === atual));
  pontos.forEach((p, k) => p.classList.toggle("on", k === atual));
  $("#hT").textContent = lista[atual].titulo;
  $("#hD").textContent = lista[atual].sinopse;
}
function iniciar() {
  clearInterval(timer);
  if (lista.length < 2 || $("#modal").classList.contains("open")) return;
  timer = setInterval(() => ir(atual + 1), TEMPO_TROCA);
}
$("#hero").addEventListener("mouseenter", () => clearInterval(timer));
$("#hero").addEventListener("mouseleave", iniciar);
$("#hPlay").onclick = $("#hInfo").onclick = () => abrir(lista[atual], anoLista);
ir(0); iniciar();

function abrir(f, ano) {
  $("#mT").textContent = f.titulo;
  $("#mD").textContent = `${ano} \u2022 ${f.sinopse}`;
  $("#mV").innerHTML = f.id
    ? `<iframe src="https://www.youtube.com/embed/${f.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="${f.titulo.replace(/"/g, "")}"></iframe>`
    : "Vídeo em breve. Adicione o código do YouTube deste curta na lista FILMES.";
  $("#modal").classList.add("open");
  clearInterval(timer);
  $("#mX").focus();
}
function fechar() { $("#modal").classList.remove("open"); $("#mV").innerHTML = ""; iniciar(); }
$("#mX").onclick = fechar;
$("#modal").onclick = e => { if (e.target.id === "modal") fechar(); };
addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
</script>
</body>
